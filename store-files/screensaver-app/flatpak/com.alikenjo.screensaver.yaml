app-id: com.alikenjo.screensaver
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: screensaver-app

finish-args:
  # Fullscreen surfaces and input events on both session types.
  - --socket=wayland
  - --socket=fallback-x11
  # dbus-next needs the session bus (org.freedesktop.ScreenSaver inhibit
  # host, StatusNotifierItem tray, org.gnome.ScreenSaver lock) and the
  # system bus (org.freedesktop.login1, org.freedesktop.UPower).
  - --socket=session-bus
  - --socket=system-bus
  - --device=dri
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-config/autostart:create
  - --talk-name=org.freedesktop.UPower
  - --talk-name=org.freedesktop.login1
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.freedesktop.ScreenSaver
  - --own-name=org.kde.StatusNotifierItem-*

modules:
  # Regenerate this from flatpak/requirements.txt before a real Flathub
  # submission -- Flathub builds have no network access, so Python deps
  # must be vendored as pinned sdist sources instead of a live `pip
  # install`. From a machine with network + pip:
  #
  #   pip install flatpak-pip-generator-alt  # or use the flatpak-builder-tools checkout
  #   ./flatpak-pip-generator --requirements-file=flatpak/requirements.txt \
  #       -o flatpak/python3-requirements
  #
  # then replace this stub with:
  #   modules:
  #     - python3-requirements.json
  #     - name: screensaver-app
  #       ...
  - name: python3-requirements-PLACEHOLDER
    buildsystem: simple
    build-commands: []
    sources: []

  - name: screensaver-app
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation .
      - install -Dm644 data/com.alikenjo.screensaver.gschema.xml
        ${FLATPAK_DEST}/share/glib-2.0/schemas/com.alikenjo.screensaver.gschema.xml
      - install -Dm644 data/screensaver-app.desktop
        ${FLATPAK_DEST}/share/applications/com.alikenjo.screensaver.desktop
      - install -Dm644 data/com.alikenjo.screensaver.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/com.alikenjo.screensaver.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/com.alikenjo.screensaver.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.alikenjo.screensaver.svg
      - glib-compile-schemas ${FLATPAK_DEST}/share/glib-2.0/schemas
    sources:
      - type: dir
        path: ..
