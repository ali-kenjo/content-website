[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screensaver-app"
version = "0.1.0"
description = "A native GTK4/libadwaita screensaver application for Linux (X11 + Wayland)."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "alikenjo" }]
keywords = ["screensaver", "gtk4", "libadwaita", "gnome", "wayland"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Screen Savers",
]
dependencies = [
    "PyGObject>=3.48",
    "pycairo>=1.20",
    "python-xlib>=0.33",
    "pywayland>=0.4.17",
    "dbus-next>=0.2.3",
    "PyOpenGL>=3.1.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
screensaver-app = "screensaver_app.main:run"

[project.urls]
Homepage = "https://github.com/alikenjo/screensaver-app"
Issues = "https://github.com/alikenjo/screensaver-app/issues"

[tool.hatch.build.targets.wheel]
packages = ["screensaver_app"]

[tool.hatch.build.targets.sdist]
include = [
    "screensaver_app",
    "data",
    "tests",
    "README.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["screensaver_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
